<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your turn · The AIOS</title>
<meta name="description" content="Five prompts for your main AIOS session: ingest, explain, build, trust, team. Plus alternatives for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#ffffff;--soft:#f7f5f1;--hairline:#e4ded4;--ink:#1a1714;--muted:#6b645b;--accent:#d93d2e;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:1200px;margin:0 auto;padding:40px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--accent)}
.lang{font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:8px 14px;cursor:pointer;flex:none}
h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:-.025em;line-height:1.08}
h1 .hl{color:var(--accent)}
.lede{color:var(--muted);font-size:clamp(16px,2.2vw,19px);margin:14px 0 18px;max-width:52ch}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.jump a{font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--hairline);border-radius:999px;padding:9px 14px;background:var(--soft)}
.jump a b{color:var(--accent)}
.jump a:hover{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--accent);border-radius:12px;overflow:hidden;scroll-margin-top:16px;box-shadow:0 1px 2px rgba(26,23,20,.04)}
@media (min-width:900px){.card{display:grid;grid-template-columns:1.1fr 1fr}.main{padding:26px 26px 22px}.main code{font-size:18px}.alts{border-top:0;border-left:1px solid var(--hairline);padding:20px 22px}}
.main{padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.label{font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.label b{color:var(--accent);font-weight:600}
.main code{font:400 16px/1.6 'JetBrains Mono',monospace;color:var(--ink);overflow-wrap:anywhere}
.copy{align-self:flex-start;font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:9px 16px;cursor:pointer;flex:none}
.copy.ok{background:var(--accent);color:#fff}
.alts{background:var(--soft);border-top:1px solid var(--hairline);padding:14px 20px 16px}
.alts h3{font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.alt{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--hairline)}
.alt:first-of-type{border-top:0}
.alt span{font-size:14.5px;color:var(--ink)}
.alt .copy{padding:6px 12px;font-size:11px}
.foot{margin-top:32px;color:var(--muted);font-size:14px}
.foot a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="eyebrow"><b data-i18n="hands">✋ Hands-on</b> · EO Barcelona · <span data-i18n="day">Day 2</span></div>
    <button class="lang" type="button" id="lang">ES</button>
  </div>
  <h1 data-i18n-html="title"></h1>
  <p class="lede" data-i18n="lede"></p>
  <nav class="jump" id="jump"></nav>
  <div class="list" id="list"></div>
  <p class="foot"><span data-i18n="climb"></span> <a href="https://chuycepeda.com/public/builder-ant.html">chuycepeda.com/public/builder-ant.html</a></p>
</main>
<script>
(function(){
var U='https://chuycepeda.substack.com/p/the-agentic-culture-team-management';
var EXP_EN='Spawn a session named explainer: in under 10 minutes, build a very clear visual of ';
var EXP_ES='Lanza una sesión llamada explainer: en menos de 10 minutos, construye un visual muy claro de ';
var T={
 en:{hands:'✋ Hands-on',day:'Day 2',title:'Your turn. <span class="hl">Five prompts, one main session.</span>',lede:'Paste any of them into your main session. It launches what it needs. You learn by using it.',alt:'Alternatively',copy:'copy',climb:'The AIOS deck, at your own pace:'},
 es:{hands:'✋ Manos a la obra',day:'Día 2',title:'Tu turno. <span class="hl">Cinco prompts, una sesión principal.</span>',lede:'Pega cualquiera en tu sesión principal. Ella lanza lo que necesita. Aprendes usándolo.',alt:'O también',copy:'copiar',climb:'El deck del AIOS, a tu ritmo:'}
};
var C=[
 {k:{en:'ingest',es:'ingerir'},
  p:{en:'Spawn a session to /aios:ingest '+U+' and tell me what it filed and where.',es:'Lanza una sesión que haga /aios:ingest '+U+' y dime qué archivó y dónde.'},
  a:[
   {en:'Spawn a session to /aios:ingest a PDF on my computer (a contract, a report) and tell me what it filed and where.',es:'Lanza una sesión que haga /aios:ingest de un PDF en mi computadora (un contrato, un reporte) y dime qué archivó y dónde.'},
   {en:'Spawn a session to /aios:ingest a YouTube talk I liked and tell me the three ideas worth keeping.',es:'Lanza una sesión que haga /aios:ingest de una charla de YouTube que me gustó y dime las tres ideas que vale la pena guardar.'},
   {en:'Spawn a session to /aios:ingest my company’s website and tell me how it connects to my context.',es:'Lanza una sesión que haga /aios:ingest del sitio web de mi empresa y dime cómo se conecta con mi contexto.'},
   {en:'Spawn a session to /aios:ingest last week’s meeting transcript and route the decisions to my projects.',es:'Lanza una sesión que haga /aios:ingest de la transcripción de la reunión de la semana pasada y lleva las decisiones a mis proyectos.'}
  ]},
 {k:{en:'explain',es:'explicar'},
  p:{en:EXP_EN+'how the /aios:company command works, so I can onboard my team.',es:EXP_ES+'cómo funciona el comando /aios:company, para incorporar a mi equipo.'},
  a:[
   {en:EXP_EN+'how /aios:collaborate works, so I can open a shared space with my team.',es:EXP_ES+'cómo funciona /aios:collaborate, para abrir un espacio compartido con mi equipo.'},
   {en:EXP_EN+'how the AIOS updates itself, and what it never touches.',es:EXP_ES+'cómo se actualiza el AIOS a sí mismo, y qué nunca toca.'},
   {en:EXP_EN+'the AIOS main CLAUDE.md: what it tells every session to do.',es:EXP_ES+'el CLAUDE.md principal del AIOS: qué le pide a cada sesión.'},
   {en:EXP_EN+'the AIOS CONTRIBUTING.md: how I can give work back to the framework.',es:EXP_ES+'el CONTRIBUTING.md del AIOS: cómo puedo aportar al framework.'}
  ]},
 {k:{en:'build',es:'construir'},
  p:{en:'I want to build my own custom agent. Pick the best agent in the AIOS to help me build it, and launch it.',es:'Quiero construir mi propio agente. Elige el mejor agente del AIOS para ayudarme a construirlo, y lánzalo.'},
  a:[
   {en:'I want to turn something I explain every week into a skill. Pick the best agent in the AIOS to help me build it, and launch it.',es:'Quiero convertir algo que explico cada semana en una skill. Elige el mejor agente del AIOS para ayudarme a construirla, y lánzalo.'},
   {en:'I want my own slash command for a routine I repeat. Pick the best agent in the AIOS to help me build it, and launch it.',es:'Quiero mi propio comando para una rutina que repito. Elige el mejor agente del AIOS para ayudarme a construirlo, y lánzalo.'},
   {en:'I want a template for my proposals. Pick the best agent in the AIOS to help me build it, and launch it.',es:'Quiero una plantilla para mis propuestas. Elige el mejor agente del AIOS para ayudarme a construirla, y lánzalo.'}
  ]},
 {k:{en:'trust',es:'confianza'},
  p:{en:'Help me personalize my INTENT.md: what you do on your own, what stays a draft for me, and what you always ask me first.',es:'Ayúdame a personalizar mi INTENT.md: qué haces por tu cuenta, qué se queda en borrador para mí y qué siempre me preguntas primero.'},
  a:[
   {en:'Show me which domains in my INTENT.md are autonomous today, and suggest one to move up a level, with your reasons.',es:'Muéstrame qué dominios de mi INTENT.md son autónomos hoy, y sugiere uno para subir de nivel, con tus razones.'},
   {en:'Help me write the anti-values in my INTENT.md: what this system must never become.',es:'Ayúdame a escribir los anti-valores de mi INTENT.md: lo que este sistema nunca debe llegar a ser.'},
   {en:'Interview me to fill in my declared context: who I am, my voice, how I work.',es:'Entrevístame para llenar mi contexto declarado: quién soy, mi voz, cómo trabajo.'},
   {en:'Walk me through my USER.md and help me personalize how /aios:today plans my day.',es:'Recórreme mi USER.md y ayúdame a personalizar cómo /aios:today planea mi día.'}
  ]},
 {k:{en:'team',es:'equipo'},
  p:{en:'Help me mount my company in my AIOS with /aios:company: walk me through create or mount, and what my team will see.',es:'Ayúdame a montar mi empresa en mi AIOS con /aios:company: guíame entre crear o montar, y qué va a ver mi equipo.'},
  a:[
   {en:'Help me open a shared space with /aios:collaborate for a project I run with part of my team.',es:'Ayúdame a abrir un espacio compartido con /aios:collaborate para un proyecto que llevo con parte de mi equipo.'},
   {en:'Generate an invite so a teammate can mount my company in their own AIOS (/aios:company --invite).',es:'Genera una invitación para que alguien de mi equipo monte mi empresa en su propio AIOS (/aios:company --invite).'},
   {en:'Help me write my company\u2019s voice.md, so every teammate\u2019s AIOS writes like us.',es:'Ayúdame a escribir el voice.md de mi empresa, para que el AIOS de cada persona del equipo escriba como nosotros.'},
   {en:'Show me what is mounted in my vault and when it last synced (/aios:company --status).',es:'Muéstrame qué está montado en mi vault y cuándo se sincronizó por última vez (/aios:company --status).'}
  ]}
];
var list=document.getElementById('list'), btn=document.getElementById('lang'), L='en';
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){
  var t=T[L], h='';
  C.forEach(function(c,i){
    h+='<div class="card" id="p'+(i+1)+'"><div class="main"><div class="label"><b>'+(i+1)+'</b> · '+c.k[L]+'</div><code>'+esc(c.p[L])+'</code><button class="copy" type="button" data-t="'+esc(c.p[L]).replace(/"/g,'&quot;')+'">'+t.copy+'</button></div>';
    h+='<div class="alts"><h3>'+t.alt+'</h3>';
    c.a.forEach(function(a){ h+='<div class="alt"><span>'+esc(a[L])+'</span><button class="copy" type="button" data-t="'+esc(a[L]).replace(/"/g,'&quot;')+'">'+t.copy+'</button></div>'; });
    h+='</div></div>';
  });
  list.innerHTML=h;
  document.getElementById('jump').innerHTML=C.map(function(c,i){return '<a href="#p'+(i+1)+'"><b>'+(i+1)+'</b> · '+c.k[L]+'</a>';}).join('');
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t[e.getAttribute('data-i18n')];});
  document.querySelectorAll('[data-i18n-html]').forEach(function(e){e.innerHTML=t[e.getAttribute('data-i18n-html')];});
  document.documentElement.lang=L; btn.textContent=L==='en'?'ES':'EN';
}
function set(l){L=l; try{localStorage.setItem('cc-lang',l);}catch(e){} render();}
var saved=null; try{saved=localStorage.getItem('cc-lang');}catch(e){}
set(saved || ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en'));
btn.addEventListener('click',function(){set(L==='en'?'es':'en');});
function fallback(t){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();return ok;}
list.addEventListener('click',function(ev){
  var c=ev.target.closest('.copy'); if(!c) return;
  var tx=c.getAttribute('data-t').replace(/&lt;/g,'<').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
  function done(){c.classList.add('ok');setTimeout(function(){c.classList.remove('ok');},1400);}
  var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject();
  Promise.race([p,new Promise(function(_,r){setTimeout(r,800);})]).then(done,function(){if(fallback(tx))done();});
});
})();
</script>
</body>
</html>
